{{/* Custom footer for LoveIt theme, two lines: social icons and copyright */}}
<footer class="footer">
  <div class="footer-container">
    <!-- Top line: Social icons -->
    <div class="footer-line" style="margin-bottom:0.2em;">
      <a href="https://bsky.app/profile/nospoonlabs.com" target="_blank" rel="noopener" title="Bluesky" style="margin:0 0.5em;display:inline-block;vertical-align:middle;">
        <img src="/images/bluesky_logo.svg" alt="Bluesky" style="height:1.6em;width:1.6em;vertical-align:middle;"/>
      </a>
      <a href="https://github.com/diegoscarabelli" target="_blank" rel="noopener" title="GitHub" style="margin:0 0.5em;display:inline-block;vertical-align:middle;">
        <img src="/images/github_logo.png" alt="GitHub" style="height:2.0em;width:2.0em;vertical-align:middle;"/>
      </a>
      <a href="https://www.linkedin.com/in/diegoscarabelli/" target="_blank" rel="noopener" title="LinkedIn" style="margin:0 0.5em;display:inline-block;vertical-align:middle;">
        <img src="/images/linkedin_logo.png" alt="LinkedIn" style="height:1.7em;width:1.7em;vertical-align:middle;"/>
      </a>
    </div>
    <!-- Bottom line: Copyright -->
    <div class="footer-line" itemscope itemtype="http://schema.org/CreativeWork">
      <i class="far fa-copyright fa-fw" aria-hidden="true"></i>
      <span itemprop="copyrightYear">
        {{ if eq now.Year 2025 }}2025{{ else }}2025 - {{ now.Year }}{{ end }}
      </span>
      Diego Scarabelli
    </div>
    <!-- GoatCounter analytics - privacy-friendly page view counter -->
    <script data-goatcounter="https://nospoonlabs.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    
    <!-- GoatCounter page view display -->
    <script>
      // Historical view counts from Busuanzi (before migration)
      var historicalCounts = {
        '/posts/us_deficit_inflation/': 213
        // Add more posts here if needed: '/posts/other-post/': count
      };
      
      // Function to get and display page views from GoatCounter
      function loadGoatCounterViews() {
        var pageviewsElement = document.getElementById('goatcounter-pageviews');
        if (!pageviewsElement) return;
        
        var siteCode = 'nospoonlabs';
        var currentPath = window.location.pathname;
        
        // Get historical count for this page
        var historicalCount = historicalCounts[currentPath] || 0;
        
        // GoatCounter API endpoint for getting page views
        var apiUrl = 'https://' + siteCode + '.goatcounter.com/api/v0/export?format=json&start-from-path=' + encodeURIComponent(currentPath);
        
        fetch(apiUrl)
          .then(response => response.json())
          .then(data => {
            var goatCounterViews = 0;
            if (data && data.hits && data.hits.length > 0) {
              goatCounterViews = data.hits[0].count || 0;
            }
            
            // Combine historical and new views
            var totalViews = historicalCount + goatCounterViews;
            pageviewsElement.textContent = totalViews;
          })
          .catch(error => {
            console.log('GoatCounter API error:', error);
            // Fallback to historical count if API fails
            pageviewsElement.textContent = historicalCount > 0 ? historicalCount : '-';
          });
      }
      
      // Load page views when page is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadGoatCounterViews);
      } else {
        loadGoatCounterViews();
      }
    </script>
  </div>
</footer>
